name: "Argo CD App Diff"

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/argocd-app-diff.yaml
      - argo-cd/apps/**
      - argo-cd/extras/**
      - argo-cd/helm_values/**

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  argocd-app-diff:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: home-ubuntu-k8s

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Diff Argo CD apps
        uses: balutoiu/gha-utils/argocd-app-diff@argocd-app-diff
        with:
          # Names must match the cluster dirs under argo-cd/apps/.
          clusters: |
            - name: k3s-ceplea
              server: argo.internal.balutoiu.com
              password: ${{ secrets.K3S_CEPLEA_ARGOCD_ADMIN_PASSWORD }}
