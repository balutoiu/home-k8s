fullnameOverride: immich-postgres

version:
  postgresql: "16"

imageCatalog:
  create: true
  images:
    # https://github.com/tensorchord/cloudnative-vectorchord
    - major: 16
      image: ghcr.io/tensorchord/cloudnative-vectorchord:16.14-1.1.1@sha256:4a26ca6aad2482289f4a3d3317ccbf1439ce3de140994598375a1f4c4e2e9f8d

cluster:
  instances: 1
  imageCatalogRef:
    kind: ImageCatalog
    name: immich-postgres
    major: 16
  resources:
    requests:
      cpu: 25m
      memory: 2Gi
    limits:
      memory: 2Gi
  storage:
    size: 10Gi
    storageClass: openebs-lvm-pv-thin
  enableSuperuserAccess: false
  # PodMonitor only: the chart's rules assume replicas. Alerts live in
  # monitoring/lib/cnpg.
  monitoring:
    enabled: true
    prometheusRule:
      enabled: false
  # A single instance cannot switch over, so a PDB would only block node drains.
  enablePDB: false
  postgresql:
    shared_preload_libraries:
      - vchord.so
  initdb:
    database: immich
    owner: immich
  roles:
    - name: immich
      superuser: true
      login: true

databases:
  - name: immich
    owner: immich
    extensions:
      - name: vector
      # Must track the vchord shipped in the image above.
      - name: vchord
        version: 1.1.1
      - name: earthdistance

# Continuous WAL archive plus a daily base backup to the horizon Garage,
# reached through node-proxy-ceplea (CoreDNS answers *.hrz locally).
backups:
  enabled: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  objectStore:
    # Argo CD treats Helm hooks as ephemeral; apply the ObjectStore before the Cluster instead.
    helmHook: false
    annotations:
      argocd.argoproj.io/sync-wave: "-1"
  endpointURL: https://s3.hrz.internal.balutoiu.com
  provider: s3
  s3:
    bucket: cnpg-ceplea-immich
  secret:
    create: false
    name: immich-postgres-backup-s3-creds
  instanceSidecarConfiguration:
    env:
      # Garage rejects requests signed for any region but its own.
      - name: AWS_DEFAULT_REGION
        value: garage
  wal:
    # snappy, the same as horizon. If Garage space ever gets tight, gzip or
    # bzip2 compress better for more CPU.
    compression: snappy
    # Garage has no server-side encryption.
    encryption: ""
  data:
    compression: snappy
    encryption: ""
  scheduledBackups:
    # 01:30 UTC, half an hour after horizon's. The ScheduledBackup webhook
    # rejects a CRON_TZ prefix.
    - name: daily
      schedule: "0 30 1 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
  retentionPolicy: "14d"
