secrets:
  # Same 1Password item the horizon garage provision job imports as the
  # "cnpg-ceplea-immich" key, renamed to the keys the cluster chart's ObjectStore expects.
  - name: immich-postgres-backup-s3-creds
    external_secret_id: "K3s-ceplea CNPG Backup - immich - S3 Creds"
    data:
      - secret_key: ACCESS_KEY_ID
        external_secret_key: AWS_ACCESS_KEY_ID
      - secret_key: ACCESS_SECRET_KEY
        external_secret_key: AWS_SECRET_ACCESS_KEY
